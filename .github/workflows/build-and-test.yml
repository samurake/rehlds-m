name: Build, Test and Release

on:
  push:
    branches: ['**']
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref_type != 'tag' }}

env:
  BUILD_JOBS: 2

jobs:
  metadata:
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.identity.outputs.version }}
      label: ${{ steps.identity.outputs.label }}
      prerelease: ${{ steps.identity.outputs.prerelease }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Validate version and tag
        id: identity
        run: python3 tools/release/package.py metadata
      - name: Check documentation and qualification tools
        run: |
          python3.12 -m venv out/python-checks
          out/python-checks/bin/python -m pip install --only-binary=:all: -r tools/linux/requirements-test.txt
          out/python-checks/bin/python tools/release/check_docs.py
          out/python-checks/bin/python -m unittest discover -s tools/release/tests -v
          out/python-checks/bin/python -m unittest discover -s tools/linux/tests -v

  build-linux:
    name: Linux i386 (GCC ${{ matrix.toolset }}, ${{ matrix.profile }})
    needs: metadata
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        include:
          - {toolset: 15, profile: release}
          - {toolset: 11, profile: release}
          - {toolset: 11, profile: sanitize}
    env:
      BUILD_PROFILE: ${{ matrix.profile }}
      BUILD_LABEL: ${{ needs.metadata.outputs.label }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build toolchain image
        run: docker build --build-arg GCC_TOOLSET=${{ matrix.toolset }} -t rehldsm-builder -f tools/linux/Dockerfile tools/linux
      - name: Build, test, inspect and package
        run: |
          mkdir -p out/ci
          docker run --rm \
            --mount "type=bind,source=$PWD,target=/source,readonly" \
            --mount "type=bind,source=$PWD/out/ci,target=/output" \
            -e BUILD_PROFILE -e BUILD_JOBS -e BUILD_LABEL \
            rehldsm-builder sh -eu -c '
              sh /source/tools/linux/build.sh
              if [ "$BUILD_PROFILE" = release ]; then
                python3 /source/tools/release/package.py package --platform linux-i386 \
                  --input /output/linux-i386 --output /output/packages \
                  --dependencies /work/build/_deps --label "$BUILD_LABEL"
              fi
            '
      - name: Build glibc compatibility baseline
        if: matrix.profile == 'release'
        run: docker build -t rehldsm-compat -f tools/linux/compat.Dockerfile tools/linux
      - name: Run release tests on glibc 2.34 without backports
        if: matrix.profile == 'release'
        run: |
          docker run --rm --network none \
            --mount "type=bind,source=$PWD,target=/source,readonly" \
            --mount "type=bind,source=$PWD/out/ci,target=/candidate" \
            rehldsm-compat python3 /source/tools/linux/compat.py check /candidate
      - name: Upload release package
        if: matrix.profile == 'release' && matrix.toolset == 15
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: packages-linux-i386
          path: out/ci/packages/*
          if-no-files-found: error
          retention-days: 30
      - name: Upload validation evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: validation-linux-gcc${{ matrix.toolset }}-${{ matrix.profile }}
          path: |
            out/ci/*.txt
            out/ci/*.xml
            out/ci/*.jsonl
            out/ci/compatibility.json
            out/ci/*/artifact-manifest.json
            out/ci/*/build-provenance.json
          retention-days: 30

  build-windows:
    name: Windows x86
    needs: metadata
    runs-on: windows-2022
    timeout-minutes: 40
    env:
      BUILD_LABEL: ${{ needs.metadata.outputs.label }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build and test with MSVC
        shell: cmd
        run: tools\windows\build.cmd
      - name: Package verified executable
        shell: pwsh
        run: |
          python tools/release/package.py package --platform windows-x86 `
            --input out/ci/windows-i386 --output out/ci/packages `
            --dependencies out/windows-build/_deps --label $env:BUILD_LABEL
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Upload release package
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: packages-windows-x86
          path: out/ci/packages/*
          if-no-files-found: error
          retention-days: 30
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: validation-windows-x86
          path: |
            out/ci/tests.xml
            out/ci/windows-i386/artifact-manifest.json
          retention-days: 30

  publish:
    name: Publish GitHub release
    needs: [metadata, build-linux, build-windows]
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      RELEASE_TAG: ${{ needs.metadata.outputs.label }}
      RELEASE_VERSION: ${{ needs.metadata.outputs.version }}
      PRE_RELEASE: ${{ needs.metadata.outputs.prerelease }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: packages-*
          merge-multiple: true
          path: dist
      - name: Verify downloads and publish all assets together
        shell: bash
        run: |
          set -euo pipefail
          test -f "dist/rehldsm-${RELEASE_TAG}-linux-i386.tar.gz"
          test -f "dist/rehldsm-${RELEASE_TAG}-windows-x86.zip"
          (cd dist && sha256sum --check --strict *.sha256)
          python3 tools/release/notes.py --repository "$GH_REPO" \
            --revision "$GITHUB_SHA" --output release-notes.md
          if gh release view "$RELEASE_TAG" --json isDraft > existing-release.json 2>/dev/null; then
            test "$(jq -r .isDraft existing-release.json)" = true || {
              echo 'Refusing to overwrite an already published release.' >&2
              exit 1
            }
          else
            gh release create "$RELEASE_TAG" --verify-tag --draft \
              --title "ReHLDS-M $RELEASE_TAG" --notes-file release-notes.md \
              --prerelease="$PRE_RELEASE"
          fi
          gh release upload "$RELEASE_TAG" dist/* --clobber
          latest=true
          if [ "$PRE_RELEASE" = true ]; then latest=false; fi
          gh release edit "$RELEASE_TAG" --draft=false --prerelease="$PRE_RELEASE" \
            --latest="$latest" --notes-file release-notes.md
