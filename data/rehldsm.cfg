# ReHLDS-M launcher configuration. Place beside hlds_linux (or hlds.exe).
# Loaded ONLY at process startup, before logging and engine initialization.
# Restart the server after editing. Map changes and exec server.cfg do not reload it.
# Syntax: key = value, with # comments. No shell commands, includes or expansion.
# Unknown/duplicate keys, invalid values and files over 64 KiB fail startup.
# Target pacing is cfg-only. The old -targetfps launch option is removed;
# remove it from the hosting panel before upgrading (otherwise startup fails).
# frame_stats_seconds overrides the optional -framestats report flag.
# Missing target_fps defaults to 0; a missing file does not enable async output.
# All loop modes, including pingboost, have a fixed 2000 iterations/sec ceiling.

# Launcher pacing target in iterations per second (not guaranteed engine FPS).
# Range: 0-2000. Built-in default: 0. This general sample uses 1500.
# 0 selects -pingboost 0-5/default, still capped at 2000 iterations/sec.
# 1-2000 selects target pacing instead of pingboost. Higher values fail startup.
# Keep sys_ticrate 0 and fps_max 0 in the game's server.cfg to avoid another cap.
target_fps = 1500

# Automatic metrics report interval, in seconds. Range: 0-3600. Default: 0.
# 0 disables automatic/final reports. Manual rehldsm_stats remains available.
# Reporting uses owned snapshots on a worker; its bounded queue can reject reports.
# Percentiles cover the latest 2048 launcher iterations, not the whole interval.
# lifetime_launcher_gt_1ms/5ms/10ms/50ms are cumulative iteration-stall counts;
# compare counter deltas between reports. These are not accepted engine frames.
frame_stats_seconds = 60

# true moves console/optional qconsole.log I/O and sink formatting to one worker.
# false keeps synchronous output. Built-in default: false; this sample enables it.
# Accepted messages retain order. Producer-side fmt formatting still runs on callers.
# Normal output is best effort. Reserved slots protect warning/error bursts;
# completely full queues still drop new messages, including warnings/errors.
# Throwing destinations are disabled/counted; healthy outputs continue.
# Fatal flush is best effort (up to 100 ms).
# Producers briefly lock queue metadata; that lock never covers output I/O.
# Orderly shutdown waits up to 1000 ms; queued output may be lost on timeout/crash.
# Existing -condebug still controls optional file logging; this does not enable it.
async_output = true

# Maximum queued output messages. Range: 64-4096. Default: 1024.
# Each slot has a fixed 8192-byte payload plus metadata; 1024 uses about 8 MiB.
# Bigger queues absorb bursts but consume more memory (about 32 MiB at 4096).
# The maximum is fixed; no unbounded allocation.
# min(64, capacity/8) slots are reserved for warnings/errors (64 at default 1024).
# Inspect output_high_water/output_dropped/output_pending through rehldsm_stats.
output_queue_capacity = 1024

# Normal output batch/flush interval, in milliseconds. Range: 10-1000. Default: 100.
# Applies only to async output; lower values show output sooner with more I/O.
# The 10 ms minimum avoids excessive timed flush wakeups.
# Warnings/errors request an earlier worker flush without waiting on the game thread.
output_flush_ms = 100
